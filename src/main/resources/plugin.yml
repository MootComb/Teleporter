name: Teleporter
version: 2.4
main: com.MootComb.Teleporter.Main
api-version: 1.13
author: MootComb
description: Teleporter and elevator plugin with GUI management.
commands:
  teleporter:
    description: Teleporter plugin main command.
    usage: /teleporter <reload|info|list|remove|view|menu|tp>
permissions:
  teleporter.reload:
    description: Allows reloading the plugin config.
    default: op
  teleporter.use:
    description: Allows using teleporter blocks.
    default: true
  teleporter.teleport:
    description: Allows using teleporter blocks.
    default: true
  teleporter.manage:
    description: Allows managing teleporter blocks.
    default: true
  teleporter.break:
    description: Allows breaking teleporter blocks.
    default: true
  teleporter.bind:
    description: Allows binding new teleporter blocks.
    default: true
  teleporter.password:
    description: Allows setting passwords on teleporter blocks.
    default: true
  teleporter.redirect:
    description: Allows editing redirect chains.
    default: true
  teleporter.hologram:
    description: Allows toggling holograms.
    default: true
  teleporter.naming:
    description: Allows naming teleporter blocks.
    default: true
  teleporter.tp:
    description: Allows teleporting to a teleporter block by command.
    default: op
  teleporter.info:
    description: Allows viewing teleporter block info.
    default: true
  teleporter.list:
    description: Allows listing own teleporter blocks.
    default: true
  teleporter.remove:
    description: Allows removing teleporter blocks by command.
    default: op
  teleporter.menu:
    description: Allows opening the teleporter GUI by command.
    default: true
  teleporter.bypass:
    description: Bypasses cooldown.
    default: op
  teleporter.bypass.access:
    description: Bypasses access level checks.
    default: op
  teleporter.bypass.distance:
    description: Bypasses distance check.
    default: op
  teleporter.bypass.crossworld:
    description: Bypasses cross-world restriction.
    default: op
  teleporter.bypass.item:
    description: Bypasses required item check.
    default: op
  teleporter.bypass.sneak:
    description: Bypasses sneak requirement.
    default: op
  teleporter.view.all:
    description: Allows viewing all teleporter blocks.
    default: op
  teleporter.view.owner:
    description: Allows viewing own teleporter blocks.
    default: true
  teleporter.view.member:
    description: Allows viewing member/governing teleporter blocks.
    default: true
  elevator.use:
    description: Allows using elevator blocks.
    default: true
  elevator.bypass:
    description: Bypasses elevator cooldown.
    default: op
